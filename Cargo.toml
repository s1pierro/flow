[package]
name = "flow"
version = "0.7.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

# Seule dépendance : fontdue, pour dessiner le texte à partir des polices du
# système. OpenGL ES est chargé à l'exécution via dlopen : les libEGL de Termux
# (Mesa) n'existent pas sur Android, il ne faut surtout pas lier dessus.
[dependencies]
fontdue = "0.9"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
